# CI for the two projects of this repository (ai-stack + pfe-rag).
#   validate : configuration files are well-formed, and every model exposed
#              by LiteLLM is a local Ollama model (sovereignty, at config level)
#   test     : pytest — the data-sovereignty test of pfe-rag
#   build    : rag-api Docker image, pushed to the GitLab container registry
#              (default branch only)
# Deployment is not automated: the stack runs on a local machine.

stages:
  - validate
  - test
  - build

validate-config:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install --quiet pyyaml
    - |
      python - <<'EOF'
      import json, yaml
      for f in ("ai-stack/docker-compose.yml", "pfe-rag/docker-compose.yml"):
          yaml.safe_load(open(f))
      json.load(open("ai-stack/keycloak/realm-pfe.json"))
      models = yaml.safe_load(open("ai-stack/litellm/config.yaml"))["model_list"]
      remote = [m["model_name"] for m in models if not m["litellm_params"]["model"].startswith("ollama/")]
      assert not remote, f"non-local models in litellm/config.yaml: {remote}"
      print(f"config OK — {len(models)} local models")
      EOF

test-sovereignty:
  stage: test
  image: python:3.11-slim
  script:
    - cd pfe-rag
    - pip install --quiet -r rag/requirements-dev.txt
    - pytest -v

build-rag-api:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/rag-api:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/rag-api:latest" pfe-rag
    - docker push "$CI_REGISTRY_IMAGE/rag-api:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/rag-api:latest"
