model_list:
  # Local embedding model, native Ollama on the host (already pulled).
  # Routed through the gateway like everything else, for the pfe-rag project.
  - model_name: bge-m3
    litellm_params:
      model: ollama/bge-m3
      api_base: http://host.docker.internal:11434
    model_info:
      mode: embedding   # embedding-only in Ollama — never chat-capable, don't select it in a chat UI

  # Local chat model, native Ollama on the host — data sovereignty for the
  # pfe-rag project.
  - model_name: rag-chat-local
    litellm_params:
      model: ollama/qwen2.5:3b
      api_base: http://host.docker.internal:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
